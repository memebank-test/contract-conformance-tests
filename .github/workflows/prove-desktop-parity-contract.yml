name: prove desktop parity contract

on:
  pull_request:
    paths:
      - ".github/workflows/prove-desktop-parity-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact interface candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: memebank/mb-interfaces
          ref: issue-16-desktop-parity-contract
          path: source
          persist-credentials: false
          token: ${{ secrets.TEST_FLEET_READ_TOKEN || secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
      - name: Compare independent desktop parity authorities
        uses: ORESoftware/typespec-json-schema-validator@813d5f021e02574f529a9553b670719f8f10d02c
        with:
          typespec: source/typespec/desktop-parity.tsp
          schema: source/json-schema/desktop-parity.schema.json
          report: target/tjsv/desktop-parity-report.json
          output_dir: target/tjsv/desktop-parity-generated
      - name: Require deterministic receipt
        shell: bash
        run: test -s target/tjsv/desktop-parity-report.json
